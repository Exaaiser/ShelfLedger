name: ShelfLedger
options:
  bundleIdPrefix: io.github.exaaiser
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ShelfLedger:
    type: application
    platform: iOS
    sources:
      - path: Application
      - path: Core
      - path: Domain
      - path: Data
      - path: Presentation
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Scan product barcodes to look up recorded prices."
        NSLocationWhenInUseUsageDescription: "Find nearby stores and match price observations to your area while you use the app."
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
  ShelfLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ShelfLedger
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ShelfLedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ShelfLedger
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ShelfLedger:
    build:
      targets:
        ShelfLedger: all
    test:
      targets:
        - ShelfLedgerTests
        - ShelfLedgerUITests
